<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>到着連絡</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      background: #f5f5f5;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
    }

    .minute {
      height: 80px;
      border: 1px solid #2f6fa3;
      background: #347fb9;
      color: #fff;
      font-size: 26px;
    }

    .message {
      width: 100%;
      height: 86px;
      border: 0;
      border-bottom: 1px solid rgba(0,0,0,.12);
      color: #fff;
      font-size: 26px;
      letter-spacing: .04em;
    }

    .green { background: #43a047; }
    .light-green { background: #5bbb5c; }
    .orange { background: #f5b24b; }

    .status {
      padding: 14px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }
  </style>
</head>

<body>
  <main class="app">
    <div id="status" class="status">読み込み中...</div>

    <section class="grid">
      <button class="minute" data-minute="5">5</button>
      <button class="minute" data-minute="10">10</button>
      <button class="minute" data-minute="15">15</button>
      <button class="minute" data-minute="20">20</button>
      <button class="minute" data-minute="25">25</button>
      <button class="minute" data-minute="30">30</button>
      <button class="minute" data-minute="35">35</button>
      <button class="minute" data-minute="40">40</button>
      <button class="minute" data-minute="45">45</button>
      <button class="minute" data-minute="50">50</button>
      <button class="minute" data-minute="55">55</button>
      <button class="minute" data-minute="60">60</button>
    </section>

    <button class="message green" data-text="分後に着きます">分後に着きます</button>
    <button class="message orange" data-text="電車が止まりました">電車が止まりました</button>
    <button class="message orange" data-text="渋滞にはまりました">渋滞にはまりました</button>
    <button class="message light-green" data-text="もう着きます">もう着きます</button>
    <button class="message light-green" data-text="今から出ます">今から出ます</button>
    <button class="message light-green" data-text="いつもの時間です">いつもの時間です</button>
  </main>

  <script>
    const LIFF_ID = "2009927876-ogDef6aH";

    let selectedMinute = null;
    const statusEl = document.getElementById("status");

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        statusEl.textContent = "送信準備OK";
      } catch (error) {
        console.error(error);
        statusEl.textContent = "LIFFの初期化に失敗しました";
      }
    }

    async function sendLineText(text) {
      try {
        setLoading(true);

        await liff.sendMessages([
          {
            type: "text",
            text
          }
        ]);

        statusEl.textContent = "送信しました";

        setTimeout(() => {
          if (liff.isInClient()) {
            liff.closeWindow();
          }
        }, 500);

      } catch (error) {
        console.error(error);
        statusEl.textContent = "送信に失敗しました";
      } finally {
        setLoading(false);
      }
    }

    function setLoading(isLoading) {
      document.querySelectorAll("button").forEach(button => {
        button.disabled = isLoading;
      });
    }

    document.querySelectorAll(".minute").forEach(button => {
      button.addEventListener("click", () => {
        selectedMinute = button.dataset.minute;
        statusEl.textContent = `${selectedMinute}分を選択中`;
      });
    });

    document.querySelectorAll(".message").forEach(button => {
      button.addEventListener("click", () => {
        const baseText = button.dataset.text;

        const text =
          baseText === "分後に着きます"
            ? `${selectedMinute || 10}分後に着きます`
            : baseText;

        sendLineText(text);
      });
    });

    main();
  </script>
</body>
</html>
